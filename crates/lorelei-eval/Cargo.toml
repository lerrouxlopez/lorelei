[package]
name = "lorelei-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
lorelei-core = { path = "../lorelei-core" }
lorelei-song = { path = "../lorelei-song" }
lorelei-lore = { path = "../lorelei-lore" }
lorelei-echo = { path = "../lorelei-echo" }
lorelei-siren = { path = "../lorelei-siren" }
lorelei-shells = { path = "../lorelei-shells" }
lorelei-tide = { path = "../lorelei-tide" }
lorelei-harbor = { path = "../lorelei-harbor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
qdrant-client = "1.18"
axum = "0.7"
async-trait = "0.1"
tower = "0.5"
hyper = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
