[package]
name = "lorelei-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
lorelei-core = { path = "../lorelei-core" }
lorelei-tide = { path = "../lorelei-tide" }
lorelei-siren = { path = "../lorelei-siren" }
lorelei-song = { path = "../lorelei-song" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"

[lints]
workspace = true
