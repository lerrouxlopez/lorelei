[package]
name = "lorelei-tide"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
lorelei-core = { path = "../lorelei-core" }
lorelei-lore = { path = "../lorelei-lore" }
lorelei-echo = { path = "../lorelei-echo" }
lorelei-song = { path = "../lorelei-song" }
lorelei-siren = { path = "../lorelei-siren" }
lorelei-shells = { path = "../lorelei-shells" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
