[package]
name = "lorelei-tide"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
lorelei-core = { path = "../lorelei-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
tracing-futures = "0.2"
regex = "1"

[dev-dependencies]
futures = "0.3"
lorelei-siren = { path = "../lorelei-siren" }
lorelei-song = { path = "../lorelei-song" }
lorelei-echo = { path = "../lorelei-echo" }
lorelei-lore = { path = "../lorelei-lore" }
qdrant-client = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
