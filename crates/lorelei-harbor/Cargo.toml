[package]
name = "lorelei-harbor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.7"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
lorelei-core = { path = "../lorelei-core" }
lorelei-echo = { path = "../lorelei-echo" }
lorelei-lore = { path = "../lorelei-lore" }
lorelei-song = { path = "../lorelei-song" }
lorelei-shells = { path = "../lorelei-shells" }
lorelei-tide = { path = "../lorelei-tide" }
qdrant-client = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
