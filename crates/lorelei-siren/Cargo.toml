[package]
name = "lorelei-siren"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
lorelei-core = { path = "../lorelei-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

[lints]
workspace = true
