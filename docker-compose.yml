name: lorelei

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lorelei
      POSTGRES_USER: lorelei
      POSTGRES_PASSWORD: lorelei
    ports:
      - "5432:5432"
    volumes:
      - lorelei_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorelei -d lorelei"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - lorelei_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - lorelei_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12

  harbor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Defaults for compose network; safe to override via `.env`
      DATABASE_URL: ${DATABASE_URL:-postgres://lorelei:lorelei@postgres:5432/lorelei}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6334}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "7331:7331"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7331/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lorelei_postgres_data:
  lorelei_qdrant_data:
  lorelei_ollama_data:
