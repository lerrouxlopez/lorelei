services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lorelei}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    healthcheck:
      test: ["CMD", "perl", "-e", "use IO::Socket::INET; my $$s = IO::Socket::INET->new(PeerAddr=>'127.0.0.1:6333', Timeout=>2) or exit 1; print $$s \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\"; my $$res=''; while(my $$line = <$$s>){ $$res .= $$line }; close $$s; exit($$res =~ m{^HTTP/1\\.[01] 200} ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  harbor:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_URL: ${QDRANT_URL}
      LORELEI_CONFIG: /app/lorelei.toml
      # Optional local provider key (only needed if your local OpenAI-compatible endpoint requires it).
      LORELEI_LOCAL_API_KEY: ${LORELEI_LOCAL_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./lorelei.toml:/app/lorelei.toml:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
