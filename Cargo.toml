[workspace]
resolver = "2"
members = [
  "crates/lorelei-core",
  "crates/lorelei-song",
  "crates/lorelei-lore",
  "crates/lorelei-echo",
  "crates/lorelei-siren",
  "crates/lorelei-shells",
  "crates/lorelei-tide",
  "crates/lorelei-harbor",
  "crates/lorelei-cli",
  "crates/lorelei-eval",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

